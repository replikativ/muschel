version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  # Babashka-against-the-same-source. The `tools/clojurecli`
  # executor (provided by the orb) already ships `bb` — datahike
  # uses it the same way for its own `bb format` / `bb test ...`
  # jobs. The `bb test` task is defined in our top-level `bb.edn`
  # and runs the cross-platform `.cljc` test suite via SCI.
  bb-test:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: Run babashka tests
          command: bb test
          no_output_timeout: 5m

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
          setup_cljs: true
      - tools/build:
          context: docker-deploy
          build_cljs: true
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/unittest:
          context: docker-deploy
          requires:
            - tools/build
      - tools/cljstest:
          context: docker-deploy
          requires:
            - tools/build
      - bb-test:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/unittest
            - tools/cljstest
            - bb-test
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
