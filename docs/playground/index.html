<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>muschel playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --fg: #c5c8c6;
        --accent: #5fb3b3;
        --dim: #717c84;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Mono", monospace;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #2a3138;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
      }
      header p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--dim);
      }
      #log {
        flex: 1;
        white-space: pre-wrap;
        padding: 12px 16px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.5;
      }
      #inputbox {
        display: flex;
        padding: 8px 16px 16px;
        border-top: 1px solid #2a3138;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      #prompt { color: var(--accent); white-space: pre; }
      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--fg);
        font: inherit;
        outline: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>muschel — bash in your browser</h1>
      <p>Try: <code>cat /README.md</code> · <code>ls /</code> · <code>echo "$((2+3))"</code> · <code>for i in 1 2 3; do echo $i; done | wc</code></p>
    </header>
    <div id="log"></div>
    <div id="inputbox">
      <span id="prompt">/ $? 0 > </span>
      <input id="input" autofocus autocomplete="off" spellcheck="false" placeholder="type a bash command and hit Enter…">
    </div>
    <script>
      // Local dev (localhost) loads the freshly-built bundle from
      // dist/npm/playground (served alongside this HTML by shadow-cljs's
      // dev-http). Deployed GitHub Pages loads from unpkg so we don't
      // commit binary blobs.
      (function () {
        var isLocal = location.hostname === 'localhost'
                   || location.hostname === '127.0.0.1';
        var src = isLocal
          ? 'playground.js'
          : 'https://unpkg.com/muschel@latest/dist/playground/playground.js';
        var s = document.createElement('script');
        s.src = src;
        s.onload = function () { muschel.playground.start(); };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
